name: Fed Monitor — Collect

on:
  schedule:
    - cron: '30 9 * * *'   # 5:30am ET (EDT) — runs before the 6:30am scoring routine so it captures the full prior day. Change to '30 10 * * *' after Nov 1 (EST).
  workflow_dispatch:         # Allow manual trigger from GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check FOMC blackout and collect
        run: |
          python3 - <<'EOF'
          from datetime import date
          import json, subprocess, sys

          # Blackout periods: single source of truth (official Fed calendar).
          today = date.today().isoformat()
          with open("blackout_periods.json") as f:
              periods = json.load(f)["periods"]
          if any(p["start"] <= today <= p["end"] for p in periods):
              print(f"BLACKOUT DAY ({today}) — skipping collection.")
              sys.exit(0)

          print(f"Not a blackout day ({today}) — collecting...")
          sys.exit(subprocess.run(["pip", "install", "-r", "requirements.txt", "-q"]).returncode
                   or subprocess.run(["python3", "main.py", "collect"]).returncode)
          EOF

      - name: Report transcript fetch failures
        if: always()
        run: |
          # Summarise by FAULT KIND. This step used to hardcode "likely cloud-IP
          # 403 from the Fed CDN", which was wrong — verified 2026-08-03 that
          # this job reaches federalreserve.gov and every regional bank fine.
          # That false attribution was copied into reports and stub files and
          # sent an analyst chasing a network problem that did not exist.
          # Report what actually happened; do not guess at a cause.
          if [ -f data/raw/_fetch_failures.json ]; then
            python3 - <<'EOF'
          import json, collections
          entries = json.load(open('data/raw/_fetch_failures.json'))
          by_kind = collections.Counter(e.get('kind', 'unknown') for e in entries)
          summary = ', '.join(f'{k}={v}' for k, v in sorted(by_kind.items()))
          print(f'::warning::{len(entries)} transcript(s) pending recovery ({summary}). '
                'Recover with "python3 main.py refetch" from a network that can reach '
                'the source. DO NOT substitute media coverage — mark the document '
                'NOT SCORED — TRANSCRIPT PENDING instead.')
          print('----- data/raw/_fetch_failures.json -----')
          for e in entries:
              print(f"  [{e.get('kind','unknown')}] status={e.get('status')} "
                    f"{e.get('url')}")
              print(f"      source={e.get('source')} "
                    f"first_seen={e.get('first_seen') or e.get('seen')}")
              if e.get('reason'):
                  print(f"      reason={e['reason'][:160]}")
          # A proxy fault is a LOCAL egress problem, not the Fed blocking us.
          if by_kind.get('proxy_blocked'):
              print('::notice::proxy_blocked entries mean an egress proxy refused '
                    'CONNECT — the origin never answered. This is an environment '
                    'problem, not a Fed CDN block.')
          EOF
          else
            echo "No transcript fetch failures recorded."
          fi

      - name: Check transcript provenance
        # --worktree, not --changed: the scraped files are still uncommitted at
        # this point, so there is nothing to diff against HEAD yet.
        run: python3 scripts/check_provenance.py --worktree

      - name: Commit new raw files
        run: |
          git config user.email "fedmonitor@noreply.github.com"
          git config user.name "Fed Monitor — Collect"
          # Include the fetch-failure manifest so the local machine can see and
          # recover cloud-IP 403 gaps via 'python3 main.py refetch'.
          git add data/raw/
          git diff --staged --quiet && echo "Nothing new to commit." || \
            git commit -m "Collect $(date -u '+%Y-%m-%d'): new raw files" && git push
